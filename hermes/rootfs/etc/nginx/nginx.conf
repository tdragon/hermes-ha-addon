# Ingress adapter for the Hermes dashboard.
#
# Home Assistant Ingress serves this add-on under a dynamic, per-session
# subpath (/api/hassio_ingress/<token>/) and passes that prefix in the
# `X-Ingress-Path` header. Hermes' dashboard instead reads `X-Forwarded-Prefix`
# to re-anchor the Vite SPA — it rewrites the absolute `/assets/...` URLs baked
# into index.html and injects `window.__HERMES_BASE_PATH__` so the SPA's API
# and WebSocket calls follow the prefix too (see hermes_cli/web_server.py
# mount_spa() upstream). The whole job of this proxy is to translate that one
# header name; Hermes does the actual URL rewriting itself.
#
# Hermes keeps binding 0.0.0.0:9119 inside the container (not published to the
# host); only this nginx and HA Supervisor/Ingress can reach it.

user www-data;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    access_log off;

    # WebSocket upgrade plumbing for the chat / PTY / events sockets.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8099;

        location / {
            proxy_pass http://127.0.0.1:9119;
            proxy_http_version 1.1;

            # The one thing that matters: HA's X-Ingress-Path -> the header
            # Hermes understands. When absent (direct, non-Ingress access) this
            # is empty and Hermes serves at root, which is also correct.
            proxy_set_header X-Forwarded-Prefix $http_x_ingress_path;
            proxy_set_header X-Forwarded-Host   $http_host;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Host               $http_host;

            # Chat / PTY / events run over long-lived WebSockets.
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Don't buffer or prematurely time out streamed/WS responses.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
